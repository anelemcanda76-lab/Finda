<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FINDA - List Business</title><style>body{font-family:system-ui;padding:16px;background:#f5f5f7}input,textarea,select{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid #ddd}button{background:#0a7a3a;color:white;padding:14px;border:none;border-radius:12px;width:100%;font-weight:800}</style></head>
<body><h2>FINDA - List Your Business Free</h2>
<input id="bname" placeholder="Business Name"><input id="bloc" placeholder="Location"><select id="bcat"><option>Meat</option><option>Shisanyama</option><option>Hair</option><option>Spaza</option><option>Services</option></select><textarea id="bdesc" placeholder="What do you sell?"></textarea><input id="bwa" placeholder="WhatsApp: 27..."><button onclick="submitBiz()">Submit via WhatsApp</button>
<script>function submitBiz(){let msg=`NEW FINDA BUSINESS:%0AName: ${bname.value}%0ALocation: ${bloc.value}%0ACat: ${bcat.value}%0ADesc: ${bdesc.value}%0AWa: ${bwa.value}`;window.location.href=`https://wa.me/27600000000?text=${msg}`;}</script></body></html>
