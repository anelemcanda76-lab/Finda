<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINDA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{background:#0f172a;color:#fff;padding:15px}
#map{height:280px;background:#ddd;width:100%}
#search{width:100%;padding:12px;border:1px solid #ddd}
.card{background:#fff;margin:10px;padding:12px;border-radius:10px}
.wa{background:#25D366;color:#fff;padding:8px 12px;border-radius:6px;text-decoration:none;display:inline-block;margin-top:8px}
#fab{position:fixed;bottom:20px;right:20px;width:60px;height:60px;background:#25D366;color:#fff;border-radius:50%;border:none;font-size:30px;z-index:999}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;padding:20px}
#modal.show{display:flex;align-items:center;justify-content:center}
.box{background:#fff;padding:20px;border-radius:12px;width:100%;max-width:350px}
.box input,.box select{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:6px}
</style>
</head>
<body>
<header><h1 style="margin:0">FINDA <span style="color:#25D366">.</span></h1><small>NU1-NU12, Veeplaas, Kamvelihle</small></header>
<div id="map"></div>
<div style="padding:10px;background:#fff"><input id="search" placeholder="Search kota, cow feet, hair..."></div>
<div id="list"></div>

<button id="fab" onclick="document.getElementById('modal').classList.add('show')">+</button>

<div id="modal">
<div class="box">
<h3 style="margin-top:0">List Your Business - FREE</h3>
<input id="f_name" placeholder="Business Name *">
<select id="f_cat" style="border:2px solid #000;font-weight:bold">
<option value="">-- CATEGORY * REQUIRED --</option>
<option value="Food">Food</option>
<option value="Services">Services</option>
<option value="Beauty">Beauty</option>
<option value="Spaza">Spaza</option>
<option value="Other">Other</option>
</select>
<input id="f_loc" placeholder="Location * e.g. Kamvelihle, Mjondolo">
<input id="f_wa" placeholder="WhatsApp * 082...">
<input id="f_price" placeholder="Price e.g. R30">
<input id="f_desc" placeholder="What do you sell?">
<button onclick="submitBiz()" style="width:100%;padding:12px;background:#0f172a;color:#fff;border:none;border-radius:8px;margin-top:10px;font-weight:bold">Submit via WhatsApp</button>
<button onclick="document.getElementById('modal').classList.remove('show')" style="width:100%;padding:10px;background:#eee;border:none;border-radius:8px;margin-top:8px">Cancel</button>
</div>
</div>

<script>
// SHOW ERROR INSTEAD OF WHITE PAGE
window.onerror = function(msg){
  document.getElementById('list').innerHTML = "<div style='padding:20px;color:red'>Error: "+msg+" - but businesses below still work</div>" + document.getElementById('list').innerHTML;
}

const businesses=[
{Name:"Siya's Fresh and Clean Cow Feet",Location:"Kamvelihle, Mjondolo",Address:"Kamvelihle, Mjondolo",Cat:"Food",Desc:"Cleaned, fresh and ready to cook",Price:"R30 cleaned, fresh and ready to cook",Wa:"0826613785",lat:-33.815,lng:25.601},
{Name:"Home of Traditional Food",Location:"Motherwell NU6 OPPOSITE HOME AFFAIRS",Address:"Motherwell NU6",Cat:"Food",Desc:"Burger,kota,lusu,sbindi,hot dogs and chips",Wa:"0737894849",lat:-33.8095,lng:25.588},
{Name:"Sears Fresh and Clean",Location:"Motherwell",Address:"Motherwell",Cat:"Services",Desc:"Laundry",Wa:"0820000000",lat:-33.804,lng:25.585},
{Name:"Cowfit",Location:"Motherwell",Address:"Motherwell",Cat:"Services",Desc:"Fitness",Wa:"0820000000",lat:-33.806,lng:25.587}
];

let map;
try{
  map = L.map('map').setView([-33.806,25.586],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  businesses.forEach(b=>{ L.marker([b.lat,b.lng]).addTo(map).bindPopup(b.Name); });
}catch(e){
  document.getElementById('map').innerHTML="<div style='padding:40px;text-align:center'>Map loading... businesses below work</div>";
}

function render(){
  let q=document.getElementById('search').value.toLowerCase();
  document.getElementById('list').innerHTML=businesses.filter(b=>(b.Name+" "+b.Location).toLowerCase().includes(q)).map(b=>`
    <div class="card">
      <b>${b.Name}</b> <span style="background:#eee;padding:2px 6px;border-radius:6px;font-size:11px">${b.Cat}</span>
      <div>📍 ${b.Location}</div>
      <div>${b.Desc}</div>
      ${b.Price?`<div style="font-weight:bold">${b.Price}</div>`:''}
      <a class="wa" href="https://wa.me/27${b.Wa.replace(/^0/,'')}" target="_blank">WhatsApp ${b.Wa}</a>
    </div>
  `).join('');
}
function submitBiz(){
  let n=document.getElementById('f_name').value;
  let c=document.getElementById('f_cat').value;
  let l=document.getElementById('f_loc').value;
  let w=document.getElementById('f_wa').value;
  if(!n||!l||!w){alert("Fill Name, Location, WhatsApp");return;}
  if(!c){alert("CATEGORY REQUIRED! Please select");return;}
  let msg=`NEW BUSINESS: ${n} | Cat: ${c} | Loc: ${l} | Wa: ${w}`;
  window.open(`https://wa.me/27737894849?text=${encodeURIComponent(msg)}`,'_blank');
  document.getElementById('modal').classList.remove('show');
}
document.getElementById('search').addEventListener('input',render);
render();
</script>
</body>
</html>
