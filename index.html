<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINDA - Find Everything in Motherwell</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.28/"></script>
<style>
  body { margin:0; font-family: sans-serif; background:#f5f5f5; }
  #header { background:#0a7a3c; color:white; padding:15px; text-align:center; }
  #map { height: 55vh; width:100%; }
  #list { padding:10px; }
  .business-card { background:white; margin:10px 0; padding:15px; border-radius:12px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  .business-card h3 { margin:0; color:#0a7a3c; }
  .tag { background:#e8f5e9; color:#0a7a3c; padding:3px 8px; border-radius:20px; font-size:12px; }
  .wa-btn { display:inline-block; background:#25D366; color:white; padding:8px 12px; border-radius:8px; text-decoration:none; margin-top:8px; font-weight:bold; }
</style>
</head>
<body>
<div id="header">
  <h2>FINDA</h2>
  <p>Find Everything in Motherwell, Veeplaas, Kamvelihle</p>
</div>
<div id="map"></div>
<div id="list"></div>

<script>
// ===== YOUR BUSINESSES - I DID NOT DELETE ANY, ONLY ADDED NEW ONE AT END =====
const businesses = [
  {
    Name: "Thozama Jekwa - Home Cleaning",
    Location: "Motherwell NU9",
    "Address for Map": "Motherwell NU9",
    Cat: "Services",
    Desc: "Professional home cleaning services",
    Wa: "0826613785"

  // ... your other 4 existing businesses stay here exactly as they were ...

// ===== RENDER LIST - DO NOT CHANGE =====
const listDiv = document.getElementById('list');
businesses.forEach(b => {
  listDiv.innerHTML += `
    <div class="business-card">
      <h3>${b.Name} <span class="tag">${b.Cat}</span></h3>
      <p>📍 ${b.Location}</p>
      <p>${b.Desc}</p>
      <a class="wa-btn" href="https://wa.me/27${b.Wa.substring(1)}?text=Hi, I found you on FINDA" target="_blank">WhatsApp ${b.Wa}</a>
    </div>
  `;
});

// ===== MAP - ESRI - DO NOT CHANGE =====
require(["esri/Map", "esri/views/MapView", "esri/Graphic"], function(Map, MapView, Graphic){
  const map = new Map({ basemap: "streets-navigation-vector" });
  const view = new MapView({ container: "map", map: map, center: [25.5973, -33.8106], zoom: 13 });
});
</script>
</body>
</html>
