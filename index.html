<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINDA - Motherwell Discovery Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Arial}
body{background:#f5f7fb}
header{background:#0f172a;color:white;padding:16px;position:sticky;top:0;z-index:10}
header h1{font-size:22px} header h1 span{color:#25D366}
#map{height:380px;width:100%;z-index:1}
.search{padding:12px;background:white;position:sticky;top:65px;z-index:9;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.search input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}
#list{padding:12px;display:grid;gap:12px;max-width:700px;margin:0 auto}
.card{background:white;padding:14px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.wa-btn{background:#25D366;color:white;padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:700;display:inline-block;margin-top:8px}
#fab{position:fixed;bottom:22px;right:22px;width:60px;height:60px;background:#25D366;color:white;border-radius:50%;border:none;font-size:32px;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:20;cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:30;padding:16px;align-items:center;justify-content:center}
#modal.show{display:flex}
.box{background:white;width:100%;max-width:380px;border-radius:14px;padding:18px}
.box input,.box select,.box textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0}
.box select{border:2px solid #0f172a;font-weight:700;background:#fffbe6}
.btn-submit{width:100%;background:#0f172a;color:white;padding:12px;border:none;border-radius:8px;font-weight:700;margin-top:8px}
.btn-close{width:100%;background:#eee;padding:10px;border:none;border-radius:8px;margin-top:6px}
</style>
</head>
<body>
<header><h1>FINDA <span>.</span></h1><p style="font-size:12px;opacity:.8">NU1 to NU12, Veeplaas, Kamvelihle - Founding 50</p></header>
<div id="map"></div>
<div class="search"><input id="search" placeholder="Search kota, cow feet, hair..."></div>
<div id="list"></div>
<button id="fab" onclick="document.getElementById('modal').classList.add('show')">+</button>
<div id="modal"><div class="box">
<h3>List Your Business - FREE</h3>
<input id="n_name" placeholder="Business Name *">
<label style="font-size:11px;font-weight:800">CATEGORY * VERY IMPORTANT</label>
<select id="n_cat">
<option value="">-- SELECT CATEGORY * --</option>
<option value="Food">🍔 Food</option>
<option value="Services">🔧 Services</option>
<option value="Beauty">💇 Beauty</option>
<option value="Spaza">🏪 Spaza</option>
<option value="Other">Other</option>
</select>
<input id="n_loc" placeholder="Location * e.g. Kamvelihle, Mjondolo">
<input id="n_wa" placeholder="WhatsApp * e.g. 0826613785">
<input id="n_price" placeholder="Price * e.g. R30 cleaned">
<textarea id="n_desc" placeholder="What do you sell?"></textarea>
<button class="btn-submit" onclick="sendBiz()">Submit via WhatsApp</button>
<button class="btn-close" onclick="document.getElementById('modal').classList.remove('show')">Cancel</button>
</div></div>
<script>
var businesses = [
  {Name:"Siya's Fresh and Clean Cow Feet",Location:"Kamvelihle, Mjondolo",Cat:"Food",Desc:"Cleaned, fresh and ready to cook cow feet",Price:"R30 cleaned, fresh and ready to cook",Wa:"0826613785",lat:-33.815,lng:25.601},
  {Name:"Home of Traditional Food",Location:"Motherwell NU6 OPPOSITE HOME AFFAIRS",Cat:"Food",Desc:"Burger,kota,lusu,sbindi,hot dogs and chips",Wa:"0737894849",lat:-33.8095,lng:25.588},
  {Name:"Sears Fresh and Clean",Location:"Motherwell NU5",Cat:"Services",Desc:"Laundry / Cleaning",Wa:"0820000000",lat:-33.804,lng:25.585},
  {Name:"Cowfit",Location:"Motherwell NU6",Cat:"Services",Desc:"Fitness",Wa:"0820000000",lat:-33.806,lng:25.587},
  {Name:"Thozama Construction",Location:"Motherwell NU6",Cat:"Services",Desc:"Building, renovations",Wa:"0712345678",lat:-33.808,lng:25.59},
  {Name:"Kasi Kota Spot",Location:"Motherwell NU2",Cat:"Food",Desc:"Best kota",Wa:"0821234567",lat:-33.802,lng:25.582},
  {Name:"Veeplaas Hair Salon",Location:"Veeplaas",Cat:"Beauty",Desc:"Braids, nails",Wa:"0781234567",lat:-33.81,lng:25.58}
];
var map = L.map('map').setView([-33.8095, 25.588], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
function render(){
  var q = document.getElementById('search').value.toLowerCase();
  document.getElementById('list').innerHTML = "";
  businesses.forEach(function(b){
    if((b.Name+" "+b.Location+" "+b.Desc).toLowerCase().indexOf(q)==-1) return;
    var m = L.marker([b.lat,b.lng]).addTo(map).bindPopup(b.Name);
    var html = '<div class="card"><b>'+b.Name+'</b> <span style="font-size:11px;background:#eee;padding:2px 6px;border-radius:6px">'+b.Cat+'</span><div style="font-size:12px;color:#666">📍 '+b.Location+'</div><div style="font-size:13px;margin-top:4px">'+b.Desc+'</div><div style="font-weight:800;margin-top:4px">'+(b.Price||'')+'</div><a class="wa-btn" href="https://wa.me/27'+b.Wa.replace(/^0/,'')+'?text=Hi, found you on FINDA" target="_blank">WhatsApp '+b.Wa+'</a></div>';
    document.getElementById('list').innerHTML += html;
  });
}
function sendBiz(){
  var name=document.getElementById('n_name').value;
  var cat=document.getElementById('n_cat').value;
  var loc=document.getElementById('n_loc').value;
  var wa=document.getElementById('n_wa').value;
  if(!name||!loc||!wa){alert("Fill Name, Location, WhatsApp");return;}
  if(!cat){alert("CATEGORY IS REQUIRED boss - select Food/Services/Beauty");return;}
  var price=document.getElementById('n_price').value;
  var desc=document.getElementById('n_desc').value;
  var msg="NEW BUSINESS FINDA:\nName: "+name+"\nCategory: "+cat+"\nLocation: "+loc+"\nWa: "+wa+"\nPrice: "+price+"\nDesc: "+desc;
  window.open("https://wa.me/27737894849?text="+encodeURIComponent(msg),"_blank");
  document.getElementById('modal').classList.remove('show');
}
document.getElementById('search').addEventListener('input',render);
render();
</script>
</body>
</html>
